<!-- The gallery is a small browsable tree, not one flat list:
     Gallery → Sports → High School → Football → (photos), etc.
     Which level is showing right now is driven entirely by
     ?path=a/b/c in the URL and content/taxonomy.json — see
     script.js's initGalleryTree. Nothing below is hand-written per
     category; add a sport, a photo, or a whole new top-level
     category by editing taxonomy.json and meta.json, not this file. -->
<section class="taxonomy-root" style="padding-top: calc(var(--nav-height) + 64px);">
  <nav class="crumb-trail" aria-label="Breadcrumb"></nav>

  <!-- Branch view: a grid of tiles, shown at every level that isn't
       an actual photo category yet (Gallery, Sports, High School,
       Professional, Projects, ...). -->
  <div class="branch-view">
    <h1 class="section-title tree-title" style="margin-bottom: 40px;"></h1>
    <div class="category-tiles-slot category-tiles"></div>
  </div>
</section>

<!-- Leaf view: shown only once the path resolves to an actual photo
     category (Football, Nature, ...) — a big photo behind the sport's
     name, then the photos themselves below it. -->
<div class="category-hero-slot category-hero" hidden></div>
<section class="leaf-grid-section" hidden>
  <div class="gallery-grid"></div>
</section>

<div class="lightbox" hidden>
  <button class="lightbox-close" aria-label="Close">&times;</button>
  <img src="" alt="">
</div>

<!-- Contact marquee — content is built at runtime from
     content/settings.json (renderContactMarquee in script.js), so it
     stays CMS-editable and never hardcodes contact details here. -->
<div class="contact-marquee" id="contact-marquee" hidden>
  <div class="contact-marquee-track" data-marquee-track></div>
</div>
